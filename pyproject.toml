[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-collision-avoidance"
version = "1.0.0"
description = "OpenEnv environment: Industrial Robot Arm Collision Avoidance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
{name = "Team Codlerz"},
]
keywords = ["openenv", "robotics", "cobot", "collision-avoidance", "reinforcement-learning"]
classifiers = [
"Programming Language :: Python :: 3.11",
"Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
"fastapi==0.111.0",
"uvicorn[standard]==0.29.0",
"pydantic==2.7.1",
"openai>=1.25.0",
"openenv-core>=0.2.0",
"requests>=2.31.0",
"websockets>=12.0",
"python-dotenv>=1.0.0"
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
"pytest",
"httpx"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
